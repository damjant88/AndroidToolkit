# Server
server.port=8080
server.address=0.0.0.0
server.error.include-message=always
server.error.include-stacktrace=always

# Deployment mode: standalone (default) or saas
deployment.mode=${DEPLOYMENT_MODE:standalone}

# Database - MySQL (standalone default, override with DATABASE_URL for PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/android_toolkit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# Object Storage (standalone uses local filesystem)
storage.endpoint=${STORAGE_ENDPOINT:}
storage.bucket=${STORAGE_BUCKET:androidtoolkit}
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.local.base-dir=${STORAGE_LOCAL_DIR:./data/storage}

# JWT
jwt.secret=${JWT_SECRET:AndroidToolkit2024SecretKeyForJWTTokenGenerationMustBe256Bits!}
jwt.access-token-expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# File upload - allow large APK files
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Log Analysis
log.analysis.cron=0 0 2 * * *

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=androidtoolkit.backend.controller
springdoc.default-flat-param-object=true
springdoc.paths-to-exclude=/api/devices/*/permissions/**
