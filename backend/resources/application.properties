# Server
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=always

# Database - H2 in-memory for development (switch to PostgreSQL later)
spring.datasource.url=jdbc:h2:mem:androidtoolkit
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# File upload - allow large APK files
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=androidtoolkit.backend.controller
springdoc.default-flat-param-object=true
springdoc.paths-to-exclude=/api/devices/*/permissions/**
