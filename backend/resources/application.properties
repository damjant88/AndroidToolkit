# Server
server.port=8080
server.address=0.0.0.0
server.error.include-message=always
server.error.include-stacktrace=always

# Database - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/android_toolkit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=AndroidToolkit2024SecretKeyForJWTTokenGenerationMustBe256Bits!
jwt.access-token-expiry-minutes=30

# File upload - allow large APK files
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Log Analysis
log.analysis.cron=0 0 2 * * *

# OpenAPI / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.default-produces-media-type=application/json
springdoc.packages-to-scan=androidtoolkit.backend.controller
springdoc.default-flat-param-object=true
springdoc.paths-to-exclude=/api/devices/*/permissions/**
