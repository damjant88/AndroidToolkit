# Server
server.port=8080

# Database - H2 in-memory for development (switch to PostgreSQL later)
spring.datasource.url=jdbc:h2:mem:androidtoolkit
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Disable security for initial API testing in Postman
# Remove this when you add real authentication
spring.security.user.name=admin
spring.security.user.password=admin
