# SaaS deployment profile - PostgreSQL + S3-compatible storage

# Database - PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/androidtoolkit}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:androidtoolkit}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Object Storage - S3 compatible
deployment.mode=saas
storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
storage.bucket=${STORAGE_BUCKET:androidtoolkit}
storage.access-key=${STORAGE_ACCESS_KEY:minioadmin}
storage.secret-key=${STORAGE_SECRET_KEY:minioadmin}

# JWT
jwt.secret=${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-chars}
jwt.access-token-expiry-minutes=${JWT_EXPIRY_MINUTES:1440}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# SMTP for invitations
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}

# SSO (Enterprise only)
sso.provider-url=${SSO_PROVIDER_URL:}
