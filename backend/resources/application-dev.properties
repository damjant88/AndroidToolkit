# H2 file-based database for local development (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/android_toolkit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Confluence
confluence.url=${CONFLUENCE_URL:https://smithmicro.atlassian.net/wiki}
confluence.username=${CONFLUENCE_USERNAME:dtomic@smithmicro.com}
confluence.api-token=${CONFLUENCE_API_TOKEN:}
